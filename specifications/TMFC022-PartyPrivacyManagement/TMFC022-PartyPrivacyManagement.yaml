apiVersion: oda.tmforum.org/v1beta2
kind: component
metadata:
  name: components.oda.tmforum.org
spec:
  name: PartyPrivacyManagement
  id: TMFC022
  functionalBlock: PartyManagement
  description: 'The Party Privacy Management component aims to: define the Privacy
    Policy rules established by the CSP, according to applicable regulations, such
    as GDPR in Europe, apply these rules to each Party interacting with the CSP and
    to all of their personnal information and personally identifiable information
    (PII); register explicit opt-in and opt-out given by Parties regarding the usage
    of some of their personal information for dedicated purpose, such as marketing.'
  publicationDate: 2024-08-08
  status: specified
  version: 1.1.0
  coreFunction:
    dependentAPIs:
    - id: TMF632
      required: true
      resources:
      - individual:
        - GET
        - GET /id
      - organization:
        - GET
        - GET /id
      version: 4
    - id: TMF669
      required: true
      resources:
      - partyRole:
        - GET
        - GET /id

      version: 4.0
    - id: TMF667
      required: false
      resources:
      - document:
        - GET
        - GET /id
        - POST
      version: 4
    - id: TMF620
      required: false
      resources:
      - productOffering:
        - GET
        - GET /id
      version: 4
    exposedAPIs:
    - id: TMF644
      required: true
      resources:
      - partyPrivacyProfileSpecification:
        - GET
        - GET /id
        - POST
        - PATCH /id
        - DELETE
      - partyPrivacyProfile:
        - GET
        - GET /id
        - POST
        - PATCH /id
        - DELETE
      - partyPrivacyAgreement:
        - GET
        - GET /id
        - POST
        - PATCH /id
        - DELETE
      version: 4
    - id: TMF701
      required: false
      resources:
      - processFlow:
        - GET
        - GET /id
        - POST
        - DELETE /id
      - taskFlow:
        - GET
        - GET /id
        - PATCH /id
      version: 4
    - id: TMF688
      required: false
      resources:
      - listener:
        - POST
      - hub:
        - POST
        - DELETE /id
      version: 4
    - name: PartyManagement
      port: 80
      version: 4
      id: TMFxxx
      required: false
      resources:
      - IndividualDeleteEvent: {}
      - OrganizationDeleteEvent: {}
      specification: https://raw.githubusercontent.com/tmforum-apis/TMF632_PartyManagement/master/TMF632-PartyManagement-v4.0.0.swagger.json
    - name: ProductCatalogManagement
      port: 80
      version: 4
      id: TMF620
      required: false
      resources:
      - ProductOfferingDeleteEvent: {}
      specification: https://github.com/tmforum-apis/TMF620_ProductCatalog/blob/master/TMF620-ProductCatalog-v4.0.0.swagger.json
    publishedEvents: []
    subscribedEvents: []
  owners:
