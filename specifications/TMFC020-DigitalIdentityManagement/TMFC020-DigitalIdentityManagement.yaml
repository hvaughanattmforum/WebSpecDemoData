apiVersion: oda.tmforum.org/v1beta2
kind: component
metadata:
  name: components.oda.tmforum.org
spec:
  coreFunction:
    dependentAPIs:
    - id: TMF632
      required: true
      resources:
      - individual:
        - GET
        - GET/id
      - organization:
        - GET
        - GET/id
      version: 4
    - id: TMF669
      required: true
      resources:
      - partyRole:
        - POST
      version: 4
    - id: TMF701
      required: false
      resources:
      - processFlow:
        - POST
        - GET
        - GET /id
        - DELETE
      - taskFlow:
        - PATCH
        - GET
        - GET /id
      version: 4
    - id: TMF688
      required: false
      resources:
      - event:
        - GET
        - GET /id
      version: 4
    exposedAPIs:
    - id: TMF720
      required: true
      resources:
      - digitalIdentity:
        - GET
        - GET/id
        - POST
        - PATCH/id
        - DELETE/id
      - roles:
        - GET
        - GET/id
        - POST
        - PATCH/id
        - DELETE/id
      version: 4
    - id: TMF701
      required: false
      resources:
      - processFlow:
        - GET
        - GET/id
        - POST
        - DELETE/id
      - taskFlow:
        - GET
        - GET/id
        - PATCH/id
      version: 4
    - id: TMF688
      required: false
      resources:
      - event:
        - GET
        - GET /id
      version: 4
    publishedEvents:
    - apitype: openapi
      implementation: /{{.Release.Name}}-digidemngt
      name: digitalIdentity
      port: 80
      resources:
      - DigitalIdentityCreateEvent
      - DigitalIdentityStateChangeEvent
      - DigitalIdentityDeleteEvent
      - DigitalIdentityAttributeValueChangeEvent
      specification: https://raw.githubusercontent.com/tmforum-apis/TMF720_DigitalIdentityManagement/master/TMF720-DigitalIdentityManagement-v4.0.0.swagger.json
    subscribedEvents:
    - apitype: openapi
      name: PartyRoleManagement
      port: 80
      resources:
      - UserRoleCreationNotification
      - UserRoleChangeNotification
      specification: https://github.com/tmforum-apis/TMF669-PartyRoleManagement/blob/master/TMF669-PartyRoleManagement-v4.0.0.swagger.json
  description: The Digital Identity Management is responsible for the parties (customers,
    employees, partners) and resources authentication.
  functionalBlock: PartyManagement
  id: TMFC020
  maintainers:
  - email: matteo.destino@accenture.com
    name: Matteo Destino
  - email: matteo.destino@accenture.com
    name: Matteo Destino
  name: DigitalIdentityManagement
  owners: []
  publicationDate: 2023-08-18 00:00:00
  status: specified
  version: 1.1.0
