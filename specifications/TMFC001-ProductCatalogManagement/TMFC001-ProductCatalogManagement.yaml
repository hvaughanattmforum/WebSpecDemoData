apiVersion: oda.tmforum.org/v1beta3
kind: component
metadata:
  name: components.oda.tmforum.org
spec:
  name: ProductCatalogManagement
  id: TMFC001
  functionalBlock: CoreCommerce
  description: The Product Catalog Management ODA Component is responsible for organizing
    the collection of Products and Product Offerings specifications that identify
    and define all requirements of a product or a product offering that can be commercialized.
  publicationDate: 2024-09-20 00:00:00
  status: specified
  version: 2.0.0
  coreFunction:
    dependentAPIs:
    - id: TMF633
      name: downstreamserviceSpecification
      apiType: openapi
      required: false
      resources:
      - serviceSpecification:
        - GET
        - GET /id
      version: 4
    - id: TMF669
      name: downstreampartyRole
      apiType: openapi
      required: false
      resources:
      - partyRole:
        - GET
        - GET /id
      version: 4
    - id: TMF632
      name: downstreamindividualorganisation
      apiType: openapi
      required: false
      resources:
      - individual:
        - GET
        - GET /id
      - organisation:
        - GET
        - GET /id
      version: 4
    - id: TMF634
      name: downstreamresourceSpecification
      apiType: openapi
      required: false
      resources:
      - resourceSpecification:
        - GET
        - GET /id
      version: 4.1
    - id: TMF651
      name: downstreamagreement
      apiType: openapi
      required: false
      resources:
      - agreement:
        - GET
        - GET /id
      - agreementSpecification:
        - GET
        - GET /id
      version: 4
    - id: TMF673
      name: downstreamgeographicAddress
      apiType: openapi
      required: false
      resources:
      - geographicAddress:
        - GET
        - GET /id
      version: 4
    - id: TMF674
      name: downstreamgeographicSite
      apiType: openapi
      required: false
      resources:
      - geographicSite:
        - GET
        - GET /id
      version: 4
    - id: TMF675
      name: downstreamgeographicLocation
      apiType: openapi
      required: false
      resources:
      - geographicLocation:
        - GET
        - GET /id
      version: 4
    - id: TMF672
      name: downstreampermission
      apiType: openapi
      required: false
      resources:
      - permission:
        - GET
        - GET /id
      version: 4
    - id: TMF662
      name: downstreamentityAssociationSpecification
      apiType: openapi
      required: false
      resources:
      - entitySpecification:
        - GET
        - GET /id
      - associationSpecification:
        - GET
        - GET /id
      version: 4
    - id: TMF620
      name: downstreamproductcatalog
      apiType: openapi
      required: false
      resources:
      - catalog:
        - GET
        - GET /id
        - POST
        - PATCH
        - DELETE
      - category:
        - GET
        - GET /id
        - POST
        - PATCH
        - DELETE
      - productOffering:
        - GET
        - GET /id
        - POST
        - PATCH
        - DELETE
      - productSpecification:
        - GET
        - GET /id
        - POST
        - PATCH
        - DELETE
      - productOfferingPrice:
        - GET
        - GET /id
        - POST
        - PATCH
        - DELETE
      - importJob:
        - GET
        - GET /id
        - POST
        - DELETE
      - exportJob:
        - GET
        - GET /id
        - POST
        - DELETE
      version: 4.1
    - id: TMF688
      name: downstreamevent
      apiType: openapi
      required: false
      resources:
      - event:
        - GET
        - GET /id
      version: 4
    exposedAPIs:
    - id: TMF620
      name: productcatalogmanagement
      path: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/productCatalogManagement/v4
      implementation: /{{.Release.Name}}-prodcatapi
      apiType: openapi
      port: 8080
      required: true
      resources:
      - catalog:
        - GET
        - GET /id
        - POST
        - PATCH
        - DELETE
      - category:
        - GET
        - GET /id
        - POST
        - PATCH
        - DELETE
      - productSpecification:
        - GET
        - GET /id
        - POST
        - PATCH
        - DELETE
      - productOffering:
        - GET
        - GET /id
        - POST
        - PATCH
        - DELETE
      - productOfferingPrice:
        - GET
        - GET /id
        - POST
        - PATCH
        - DELETE
      - exportJob:
        - POST
        - GET
        - GET /id
        - DELETE
      - importJob:
        - POST
        - GET
        - GET /id
        - DELETE
      version: 4.1
    - id: TMF701
      name: processflowmanagement
      implementation: /{{.Release.Name}}-procflwapi
      apiType: openapi
      path: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/processFlowManagement/v4
      port: 8080
      required: false
      resources:
      - processFlow:
        - POST
        - GET
        - GET /id
        - DELETE
      - taskFlow:
        - PATCH
        - GET
        - GET /id
      version: 4.1
    - id: TMF671
      name: promotionmanagement
      implementation: /{{.Release.Name}}-promgmtapi
      apiType: openapi
      path: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/promotionManagement/v4
      port: 8080
      required: false
      resources:
      - promotion:
        - GET
        - GET /id
        - POST
        - PATCH
        - DELETE
      version: 4.1
    - id: TMF688
      name: eventmanagement
      implementation: /{{.Release.Name}}-evntmgmtapi
      apiType: openapi
      path: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/eventManagement/v4
      port: 8080
      required: false
      resources:
      - listener:
        - POST
      - hub:
        - POST
        - DELETE
      version: 4
  eventNotification:
    publishedEvents:
      - apiType: openapi
        hub: /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/productspecification/hub
        implementation: /{{.Release.Name}}-ProductCatalogManagementEvent
        name: ProductCatalogManagement
        port: 80
        resources:
        - productSpecificationCreate
        - productSpecificationDeleteEvent
        - categoryCreateEvent
        - categoryDeleteEvent
        - productOfferingCreateEvent
        - productOfferingAttributeValueChangeEvent
        - productOfferingStateChangeEvent
        - productOfferingDeleteEvent
        - productOfferingPriceCreateEvent
        - productOfferingPriceAttributeValueChangeEvent
        - productOfferingPriceStateChangeEvent
        - productOfferingPriceDeleteEvent
        - catalogCreateEvent
        - catalogDeleteEvent
        - catalogBatchEvent
        specification: https://github.com/tmforum-apis/TMF620_ProductCatalog/blob/master/TMF620-ProductCatalog-v4.0.0.swagger.json
      - apiType: openapi
        hub: /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/PromotionManagementEvent/hub
        implementation: /{{.Release.Name}}-PromotionManagementEvent
        name: PromotionManagement
        port: 80
        resources:
        - promotionCreateEvent
        - promotionDeleteEvent
        - promotionAttributeValueChangeEvent
        - promotionStateChangeEvent
        - promotionInformationRequiredEvent
        specification: https://github.com/tmforum-apis/TMF671_Promotion/blob/master/TMF671-Promotion-v4.1.0.swagger.json
      - apiType: openapi
        hub: /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/ProcessFlowManagement/hub
        implementation: /{{.Release.Name}}-ProcessFlowManagementEvent
        name: ProcessFlowManagement
        port: 80
        resources:
        - processFlowCreateEvent
        - processFlowStateChangeEvent
        - processFlowStateDeleteEvent
        - processFlowStateAttributeValueChangeEvent
        - taskFlowCreateEvent
        - taskFlowStateChangeEvent
        - taskFlowDeleteEvent
        - taskFlowAttributeValueChangeEvent
        - taskFlowInformationRequiredEvent
        specification: https://github.com/tmforum-apis/TMF701_ProcessFlow/blob/master/TMF701-ProcessFlow-v4.1.0.swagger.json
    subscribedEvents:
      - apiType: openapi
        call-back: /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/servicepecification/call-back
        implementation: /{{.Release.Name}}-ServiceCatalogManagement
        name: ServiceCatalogManagement
        port: 80
        resources:
        - serviceSpecificationStateChange
        - serviceSpecificationAttributeValueChangeEvent
        - serviceSpecificationCreateEvent
        - serviceSpecificationDeleteEvent
        - resourceSpecificationCreateEvent
        - resourceSpecificationChangeEvent
        - resourceSpecificationDeleteEvent
        specification: https://open-api.tmforum.org/TMF633-Servicecatalog-v4.0.0.swagger.json
      - apiType: openapi
        call-back: /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/servicepecification/call-back
        implementation: /{{.Release.Name}}-PartyRoleManagement
        name: PartyRoleManagement
        port: 80
        resources:
        - partyRoleDeleteEvent
        specification: https://raw.githubusercontent.com/tmforum-apis/TMF701_ProcessFlow/master/TMF701-ProcessFlow-v4.1.0.swagger.json
      - apiType: openapi
        call-back: /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/servicepecification/call-back
        implementation: /{{.Release.Name}}-UserRolePermission
        name: UserRolePermission
        port: 80
        resources:
        - permissionDeleteEvent
        specification: https://github.com/tmforum-apis/TMF672_UserRolesPermissions/blob/master/TMF672-UserRolePermission-v4.0.0.swagger.json
      - apiType: openapi
        call-back: /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/servicepecification/call-back
        implementation: /{{.Release.Name}}-Party
        name: Party
        port: 80
        resources:
        - individualDeleteEvent
        - organizationDeleteEvent
        specification: https://raw.githubusercontent.com/tmforum-apis/TMF632_Party/master/TMF632-Party-v4.0.0.swagger.json
  owners:
    - email: gaetano.biancardi@accenture.com
      name: Gaetano Biancardi
  managementFunction: 
    exposedAPIs: 
    - name: metrics
      apiType: prometheus
      implementation: /{{.Release.Name}}-{{.Values.component.name}}-sm
      path: /{{.Release.Name}}-{{.Values.component.name}}/metrics
      port: 4000    
  securityFunction:
    controllerRole: /{{ .Values.security.controllerRole }}
    exposedAPIs: 
    - name: partyrole
      specification: ["https://raw.githubusercontent.com/tmforum-apis/TMF669_PartyRole/master/TMF669-PartyRole-v4.0.0.swagger.json"]
      implementation: /{{.Release.Name}}-partyroleapi
      apiType: openapi
      path: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/partyRoleManagement/v4
      developerUI: /{{.Release.Name}}-{{.Values.component.name}}/tmf-api/partyRoleManagement/v4/docs
      port: 8080