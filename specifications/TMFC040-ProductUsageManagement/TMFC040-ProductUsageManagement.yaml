apiVersion: oda.tmforum.org/v1beta2
kind: component
metadata:
  name: components.oda.tmforum.org
spec:
  id: TMFC040
  name: ProductUsageManagement
  functionalBlock: CoreCommerce 
  description: "Provides standardized mechanism for product usage management such as creation, update, retrieval, import and export of a collection of usages. It allows a service provider to 1) retrieve usage generated by a partner service platform in order to rate it and 2) to provide rated usage to a partner for consumption follow-up purposes."
  version: 1.0.0
  status: specified 
  publicationDate: 2024-01-22
  maintainers:
    - name: Gaetano Biancardi
      email: gaetano.biancardi@accenture.com
    - name: Elisabeth Andersson
      email: elisabeth.andersson@matrixx.com 
  owners: 
    - name: Gaetano Biancardi
      email: gaetano.biancardi@accenture.com
    - name: Elisabeth Andersson
      email: elisabeth.andersson@matrixx.com       
  coreFunction:
    exposedAPIs:
      - name: UsageManagement
        id: TMF635
        required: true
        version: 4.0
        specification: https://github.com/tmforum-apis/TMF635_UsageManagement/blob/master/TMF635-UsageManagement-v4.0.0.swagger.json 
        implementation: '/{{.Release.Name}}-usageManagement'
        apitype: openapi
        path: >-
          /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/usageManagement/v4
        developerUI: >-
          /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/usageManagement/v4/docs
        port: 8080
        resources:
          - Usage:
            - GET
            - GET/id
            - POST
            - PATCH/id
      - name: UsageConsumption
        id: TMF677
        required: true
        version: 4.0
        specification: https://github.com/tmforum-apis/TMF677_UsageConsumption/blob/master/TMF677-UsageConsumption-v4.0.1.swagger.json
        implementation: '/{{.Release.Name}}-UsageConsumption'
        apitype: openapi
        path: >-
          /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/UsageConsumption/v4
        developerUI: >-
          /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/usageManagement/v4/docs
        port: 8080
        resources:
          - queryUsageConsumption:
            - GET
            - GET/id
            - POST
      - name: ProcessFlowManagement
        id: TMF701
        required: false
        version: 4.0
        specification: >-
          https://raw.githubusercontent.com/tmforum-apis/TMF701_ProcessFlowManagement/master/TMF701-ProcessFlowManagement-v4.0.0.swagger.json
        implementation: '/{{.Release.Name}}-procmngttapi'
        apitype: openapi
        path: >-
          /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/ProcessFlowManagement/v4
        developerUI: >-
          /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/ProcessFlowManagement/v4/docs
        port: 8080
        resources:
          - processFlow:
              - GET
              - GET /id
              - POST
              - DELETE /id
          - taskFlow:
              - GET
              - GET /id
              - PATCH /id
      - name: Event
        id: TMF688
        required: false
        version: 4.0
        specification: >-
          https://raw.githubusercontent.com/tmforum-apis/TMF671_Promotion/master/TMF671-Promotion-v4.0.0.swagger.json
        implementation: '/{{.Release.Name}}-PromotionManagement'
        apitype: openapi
        path: >-
          /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/PromotionManagement/v4
        developerUI: >-
          /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/PromotionManagement/v4/docs
        port: 8080
        resources:
          - listener:
            - POST
          - hub:
            - POST
            - DELETE /id
    dependentAPIs:
      - name: PartyManagement
        id: TMF632
        required: true
        version: 4.0
        specification: >-
          https://raw.githubusercontent.com/tmforum-apis/TMF632_PartyManagement/master/TMF632-PartyManagement-v4.0.0.swagger.json
        apitype: openapi
        resources:
          - individual:
            - GET
            - GET /id
          - organization:
            - GET
            - GET /id
      - name: PartyRoleManagement
        id: TMF669
        required: false
        version: 4.0
        specification: >-
          https://github.com/tmforum-apis/TMF669-PartyRoleManagement/blob/master/TMF669-PartyRoleManagement-v4.0.0.swagger.json
        apitype: openapi
        resources:
          - PartyRole:
              - GET
              - GET /id
      - name: Productinventory
        id: TMF637
        required: false
        version: 4.0
        specification: https://raw.githubusercontent.com/tmforum-apis/TMF637_ProductInventory/master/TMF637-ProductInventory-v4.0.0.swagger.json
        apitype: openapi
        port: 8080
        resources:
          - product:
            - GET
            - GET /id
      - name: UserRolePermissionManagement
        id: TMF672
        required: true
        version: 4.0
        specification: >-
          https://github.com/tmforum-apis/TMF672-UserRolePermission/blob/master/TMF672-UserRolePermission-v4.0.0.swagger.json
        apitype: openapi
        resources:
          - permission:
              - GET
              - GET /id
          - userRole:
              - GET
              - GET /id
      - name: Event
        id: TMF688
        required: false
        version: 4.0
        specification: >-
          https://github.com/tmforum-apis/TMF688-Event/blob/master/TMF688-Event-v4.0.0.swagger.json
        apitype: openapi
        resources:
          - event:
              - GET
              - GET /id
      - name: ProcessFlowManagement
        id: TMF701
        required: false
        version: 4.0
        specification: >-
          https://raw.githubusercontent.com/tmforum-apis/TMF701_ProcessFlow/master/TMF701-ProcessFlow-v4.0.0.swagger.json
        apitype: openapi
        resources:
          - processFlow:
              - POST
              - GET
              - GET /id
              - PATCH
                
    publishedEvents:
      - name: UsageConsumption
        specification: https://github.com/tmforum-apis/TMF677_UsageConsumption/blob/master/TMF677-UsageConsumption-v4.0.1.swagger.json
        hub: /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/UsageConsumption/hub
        apitype: openapi
        port: 80
        resources:
          - queryUsageConsumptionCreateEvent
          - queryUsageConsumptionDeleteEvent
          - queryUsageConsumptionStateChangeEvent
      - name: UsageManagement
        specification: https://github.com/tmforum-apis/TMF635_UsageManagement/blob/master/TMF635-UsageManagement-v4.0.0.swagger.json
        hub: /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/usageManagement/hub
        apitype: openapi
        port: 80
        resources:
          - usageCreateEvent
          - usageAttributeValueChangeEvent
          - usageDeleteEvent
          - usageStateChangeEvent
          - usageSpecificationCreateEvent
          - usageSpecificationAttributeValueChangeEvent
          - usageSpecificationDeleteEvent        
    subscribedEvents:
      - name: Party
        specification: https://raw.githubusercontent.com/tmforum-apis/TMF632_PartyManagement/master/TMF632-PartyManagement-v4.0.0.swagger.json
        call-back: /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/party/call-back
        apitype: openapi
        port: 80
        resources:
          - individualDeleteEvent
          - organizationDeleteEvent
      - name: PartyRoleManagement
        specification: https://github.com/tmforum-apis/TMF669-PartyRoleManagement/blob/master/TMF669-PartyRoleManagement-v4.0.0.swagger.json
        call-back: /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/partyrole/call-back
        apitype: openapi
        port: 80
        resources:
          - partyRoleCreateEvent
          - partyRoleAttributeValueChangeEvent
          - partyRoleStateChangeEvent
          - partyRoleDeleteEvent
