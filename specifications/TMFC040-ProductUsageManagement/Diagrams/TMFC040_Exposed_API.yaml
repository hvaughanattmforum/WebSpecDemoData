@startyaml
exposedAPIs:
    - id: TMF635
      name: Usage Management API
      apiSDO: tmForum
      required: true
      specification:
      - version: 4
        resources:
        - usage:
          - GET
          - GET/id
          - POST
          - PATCH/id
    - id: TMF677
      name: Usage Consumption Management API
      apiSDO: tmForum
      required: true
      specification:
      - version: 5
        resources:
        - queryUsageConsumption:
          - GET
          - GET /id
          - POST
      - version: 4
        resources:
        - queryUsageConsumption:
          - GET
          - GET/id
          - POST
    - id: TMF701
      name: Process Flow Management API
      apiSDO: tmForum
      required: false
      specification:
      - version: 4
        resources:
        - processFlow:
          - GET
          - GET /id
          - POST
          - DELETE /id
        - taskFlow:
          - GET
          - GET /id
          - PATCH /id

@endyaml
