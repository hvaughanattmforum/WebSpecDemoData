apiVersion: oda.tmforum.org/v1
kind: Component
metadata:
  name: components.oda.tmforum.org
spec:
  coreFunction:
    dependentAPIs:
    - id: TMF632
      apiSDO: tmForum
      required: true
      specification:
      - version: 5
        resources:
        - individual:
          - GET
          - GET /id
        - organization:
          - GET
          - GET /id
      - version: 4
        resources:
        - individual:
          - GET
          - GET /id
        - organization:
          - GET
          - GET /id
    - id: TMF701
      apiSDO: tmForum
      required: false
      specification:
      - version: 4
        resources:
        - processFlow:
          - POST
          - GET
          - GET /id
          - DELETE
        - taskFlow:
          - PATCH
          - GET
          - GET /id
    exposedAPIs:
    - id: TMF672
      apiSDO: tmForum
      required: true
      specification:
      - version: 4
        resources:
        - permission:
          - GET
          - GET /id
          - POST
          - PATCH /id
          - DELETE /id
        - userRole:
          - GET
          - GET /id
          - POST
          - PATCH /id
          - DELETE /id
    - id: TMF669
      apiSDO: tmForum
      required: true
      specification:
      - version: 5
        resources:
        - partyRole:
          - GET
          - GET /id
          - POST
          - PATCH /id
          - DELETE /id
      - version: 4
        resources:
        - partyRole:
          - GET
          - GET /id
          - POST
          - PATCH /id
          - DELETE /id
    publishedEvents:
    - implementation: /{{.Release.Name}}-userrole&permapi
      name: userRole
      port: 80
      resources:
      - permissionCreateEvent
      - permissionAttributeValueChangeEvent
      - permissionStateChangeEvent
      - permissionDeleteEvent
      - userRoleCreateEvent
      - userRoleAttributeValueChangeEvent
      - userRoleStateChangeEvent
      - userRoleDeleteEvent
      specification: https://raw.githubusercontent.com/tmforum-apis/TMF672_UserRoleAndPermission/master/TMF672-UserRolePermission-v4.0.0.swagger.json
      apiType: openapi
    - implementation: /{{.Release.Name}}-partyroleapi
      name: partyRole
      port: 80
      resources:
      - PartyRoleCreateEvent
      - PartyRoleAttributeValueChangeEvent
      - PartyRoleStateChangeEvent
      - PartyRoleDeleteEvent
      specification: https://raw.githubusercontent.com/tmforum-apis/TMF669_PartyRoleManagement/master/TMF672-PartyRoleManagement-v4.0.0.swagger.json
      apiType: openapi
    subscribedEvents:
    - implementation: /{{.Release.Name}}-PartyManagement
      name: PartyManagement
      port: 80
      resources:
      - individualCreateEvent
      - individualAttributeValueChangeEvent
      - individualStateChangeEvent
      - organizationCreateEvenet
      - organizationAttributeValueChangeEvent
      - organizationStateChangeEvent
      specification: https://raw.githubusercontent.com/tmforum-apis/TMF632_PartyManagement/master/TMF632-PartyManagement-v4.0.0.swagger.json
      apiType: openapi
    - implementation: /{{.Release.Name}}-ProcessFlowManagement
      name: ProcessFlowManagement
      port: 80
      resources:
      - processFlowCreateEvent
      - processFlowStateChangeEvent
      - taskFlowCreateEvent
      - taskFlowStateChangeEvent
      specification: https://raw.githubusercontent.com/tmforum-apis/TMF701_ProcessFlow/master/TMF701-ProcessFlow-v4.1.0.swagger.json
      apiType: openapi
  componentMetadata:
    id: TMFC035
    name: PermissionsManagement
    version: 1.2.1
    description: The Permissions Management component manages and exposes roles and related permissions. This component enables creation, modification and deletion of permissions and delegate permissions. When a specific role is assigned, a set of permissions is inherited.
    publicationDate: 2026-05-21
    status: preview
    functionalBlock: PartyManagement
    owners:
    - email: Redacted
      name: Redacted
      url: Redacted
    maintainers:
    - name: Redacted
      email: components@tmforum.org
      url: Redacted
    eTOMs: []
    functionalFrameworkFunctions: []
    SIDs:
    - Shared_Domain|Permission_ABE|PermissionSpecSet_BE|v25.0
    - Shared_Domain|Permission_ABE|PermissionSet_BE|v25.0
    - Shared_Domain|Permission_ABE|Permission_BE|v25.0
    - Shared_Domain|Party_ABE|PartyRole_BE|v25.0
    - Shared_Domain|Party_ABE|PartyRoleSpecification_BE|v25.0
    - Shared_Domain|Party_ABE|Party_Organization_ABE|v25.0
    - Market_&_Sales_Domain|Market_Sales_Party_Roles_ABE|v25.0
    - Service_Domain|Service_Party_Roles_ABE|v25.0
    - Resource_Domain|Resource_Party_Roles_ABE|v25.0
