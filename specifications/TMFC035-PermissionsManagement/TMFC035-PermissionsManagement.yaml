apiVersion: oda.tmforum.org/v1
kind: Component
metadata:
  name: components.oda.tmforum.org
spec:
  coreFunction:
    dependentAPIs:
    - id: TMF632
      required: true
      resources:
      - individual:
        - GET
        - GET/id
      - organization:
        - GET
        - GET/id
      version: 4
      apiSDO: tmForum
    - id: TMF701
      required: false
      resources:
      - processFlow:
        - POST
        - GET
        - GET /id
        - DELETE
      - taskFlow:
        - PATCH
        - GET
        - GET /id
      version: 4
      apiSDO: tmForum
    exposedAPIs:
    - id: TMF672
      required: true
      resources:
      - permission:
        - GET
        - GET/id
        - POST
        - PATCH/id
        - DELETE/id
      - userRole:
        - GET
        - GET/id
        - POST
        - PATCH/id
        - DELETE/id
      version: 4
      apiSDO: tmForum
    - id: TMF669
      required: true
      resources:
      - partyRole:
        - GET
        - GET/id
        - POST
        - PATCH/id
        - DELETE/id
      version: 4
      apiSDO: tmForum
    publishedEvents:
    - implementation: /{{.Release.Name}}-userrole&permapi
      name: userRole
      port: 80
      resources:
      - permissionCreateEvent
      - permissionAttributeValueChangeEvent
      - permissionStateChangeEvent
      - permissionDeleteEvent
      - userRoleCreateEvent
      - userRoleAttributeValueChangeEvent
      - userRoleStateChangeEvent
      - userRoleDeleteEvent
      specification: https://raw.githubusercontent.com/tmforum-apis/TMF672_UserRoleAndPermission/master/TMF672-UserRolePermission-v4.0.0.swagger.json
      apiType: openapi
    - implementation: /{{.Release.Name}}-partyroleapi
      name: partyRole
      port: 80
      resources:
      - PartyRoleCreateEvent
      - PartyRoleAttributeValueChangeEvent
      - PartyRoleStateChangeEvent
      - PartyRoleDeleteEvent
      specification: https://raw.githubusercontent.com/tmforum-apis/TMF669_PartyRoleManagement/master/TMF672-PartyRoleManagement-v4.0.0.swagger.json
      apiType: openapi
    subscribedEvents:
    - implementation: /{{.Release.Name}}-PartyManagement
      name: PartyManagement
      port: 80
      resources:
      - individualCreateEvent
      - individualAttributeValueChangeEvent
      - individualStateChangeEvent
      - organizationCreateEvenet
      - organizationAttributeValueChangeEvent
      - organizationStateChangeEvent
      specification: https://raw.githubusercontent.com/tmforum-apis/TMF632_PartyManagement/master/TMF632-PartyManagement-v4.0.0.swagger.json
      apiType: openapi
    - implementation: /{{.Release.Name}}-ProcessFlowManagement
      name: ProcessFlowManagement
      port: 80
      resources:
      - processFlowCreateEvent
      - processFlowStateChangeEvent
      - taskFlowCreateEvent
      - taskFlowStateChangeEvent
      specification: https://raw.githubusercontent.com/tmforum-apis/TMF701_ProcessFlow/master/TMF701-ProcessFlow-v4.1.0.swagger.json
      apiType: openapi
  componentMetadata:
    id: TMFC035
    name: PermissionsManagement
    version: 1.1.1
    description: 'The Permissions Management component manages and exposes roles and related permissions. 
      This component enables creation, modification and deletion of permissions and delegate permissions. 
      When a specific role is assigned, a set of permissions is inherited.'
    publicationDate: 2023-08-18 00:00:00
    status: specified
    functionalBlock: PartyManagement
    owners:
    - email: Redacted
      name: Redacted
      url: Redacted
    maintainers:
    - name: Redacted
      email: components@tmforum.org
      url: Redacted
    eTOMs: []
    functionalFrameworkFunctions: []
    SIDs:
    - Shared Domain | Permission ABE | PermissionSpecSet BE | v25.0
    - Shared Domain | Permission ABE | PermissionSet BE | v25.0
    - Shared Domain | Permission ABE | Permission BE | v25.0
    - Shared Domain | Party ABE | PartyRole BE | v25.0
    - Shared Domain | Party ABE | PartyRoleSpecification BE | v25.0
    - Shared Domain | Party ABE | Party Organization ABE | v25.0
    - Market & Sales Domain | Market Sales Party Roles ABE | v25.0
    - Service Domain | Service Party Roles ABE | v25.0
    - Resource Domain | Resource Party Roles ABE | v25.0
