@startyaml
exposedAPIs:
    - id: TMF679
      name: Product Offering Qualification Management API
      apiSDO: tmForum
      required: true
      specification:
      - version: 4
        resources:
        - productOfferingQualification:
          - GET
          - GET/id
          - POST
          - PATCH/id
          - DELETE
    - id: TMF760
      name: Product Configuration Management API
      apiSDO: tmForum
      required: true
      specification:
      - version: 5
        resources:
        - checkProductConfiguration:
          - GET
          - POST
        - queryProductConfiguration:
          - GET
          - POST
    - id: TMF701
      name: Process Flow Management API
      apiSDO: tmForum
      required: false
      specification:
      - version: 4
        resources:
        - processFlow:
          - POST
          - GET
          - GET /id
          - DELETE
        - taskFlow:
          - GET
          - get /id
          - PATCH

@endyaml
