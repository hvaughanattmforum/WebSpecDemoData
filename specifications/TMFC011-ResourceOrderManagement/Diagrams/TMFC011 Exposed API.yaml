@startyaml
exposedAPIs:
    - id: TMF652
      name: Resource Order Management API
      apiSDO: tmForum
      required: true
      specification:
      - version: 4
        resources:
        - resourceOrder:
          - GET
          - GET /id
          - POST
          - PATCH
          - DELETE
        - cancelResourceOrder:
          - GET
          - GET /id
          - POST
    - id: TMF701
      name: Process Flow Management API
      apiSDO: tmForum
      required: false
      specification:
      - version: 4
        resources:
        - processFlow:
          - POST
          - GET
          - GET /id
          - DELETE
        - taskFlow:
          - PATCH
          - GET
          - GET /id

@endyaml
