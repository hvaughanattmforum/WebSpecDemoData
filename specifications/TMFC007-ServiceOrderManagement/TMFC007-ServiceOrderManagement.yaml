        implementation: '/{{.Release.Name}}-serviceOrdeManagement'
        apitype: openapi
        path: /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/serviceOrdeManagement/v4
        developerUI: /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/serviceOrdeManagement/v4/docs
