      apiSDO: tmForum
      required: true
      specification:
      - version: 4
        resources:
        - serviceOrder:
          - GET
          - GET /id
          - POST
          - PATCH
          - DELETE
        - cancelServiceOrder:
          - GET
          - GET /id
          - POST
    - id: TMF701
      name: Process Flow Management API
      apiSDO: tmForum
      required: false
      specification:
      - version: 4
        resources:
        - processFlow:
          - GET
          - GET /id
          - POST
          - DELETE /id
        - taskFlow:
          - GET
          - GET /id
          - PATCH /id

@endyaml
