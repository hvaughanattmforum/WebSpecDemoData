        - GET
        - GET /id
        - PATCH /id
      version: 5

    - id: TMF632
      required: false
      resources:
      - individual:
        - GET
        - GET /id
      - organization:
        - GET
        - GET /id
      version: 4
    - id: TMF669
      required: false
      resources:
      - partyRole:
        - GET
        - GET /id
      version: 4
    - id: TMF915
      required: false
      resources:
      - aiModelSpecification:
        - GET
        - GET /id
      - aiModelContractSpecification:
        - GET
        - GET /id
      - aiModelContract:
        - GET
        - GET /id
      version: 4      
    exposedAPIs:
