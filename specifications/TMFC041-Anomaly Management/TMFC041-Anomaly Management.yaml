apiVersion: oda.tmforum.org/v1beta4
kind: component
metadata:
  name: components.oda.tmforum.org
spec:
  name: Anomaly Management 
  id: TMFC041
  functionalBlock: Intelligence Management
  description: "The Anomaly Management ODA Component is responsible for predicting, detecting and managing anomalous patterns 
    in the usage and behavior of products, services and resources in order to avoid occurence of problems. Anomaly Management ODA component has fuctionality to 
    predict, detect and flag unusual patterns or outliers for products, services and resource entities, and initiating mitigatory actions to prevent outlier 
    patterns in usage or behavior to become problems. In the event of failure to predict or detect an early warning signt to a possible problem occurence, 
    the component hands of mitigatory actions to the ODA problem management component."
  publicationDate: 2024-11-19 00:00:00
  status: specified
  version: 1.1.0
  coreFunction:
    dependentAPIs:
    - id: TMF688
      required: false
      resources:
      - event:
        - GET
        - GET /id
        - POST
      version: 4
    - id: TMF642
      required: false
      resources:
      - alarm:
        - GET
        - GET /id
        - POST
      version: 4
    - id: TMF723
      required: false
      resources:
