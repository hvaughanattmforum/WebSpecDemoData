        - GET /id
      - geographicSubAddress:
        - GET
        - GET /id
      version: 4
      apiSDO: tmForum
    - id: TMF674
      required: true
      resources:
      - geographicSite:
        - GET
        - GET /id
        - POST
        - PATCH
        - DELETE
      version: 4
      apiSDO: tmForum
    - id: TMF675
      required: true
      resources:
      - geographicLocation:
        - GET
        - GET /id
        - POST
        - PATCH
        - DELETE
      version: 4
      apiSDO: tmForum
    - id: TMF701
