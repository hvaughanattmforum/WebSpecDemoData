      apiType: openapi
    subscribedEvents: []
  componentMetadata:
    id: TMFC014
    name: LocationManagement
    version: 1.1.1
    description: "The Location Management Component  allows easy reference to geographic\
      \ places important to other entities, where a geographic place is an entity\
      \ that can answer the question \u201Cwhere?\u201D . This component could  be\
      \ a facade tool into GIS systems (e.g. Google Maps)"
    publicationDate: 2023-08-18 00:00:00
    status: specified
    functionalBlock: Production
    owners:
    - email: Redacted
      name: Redacted
      url: Redacted
    maintainers:
    - name: Redacted
