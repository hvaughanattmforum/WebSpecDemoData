  componentMetadata:
    id: TMFC055
    name: ServiceTestManagement
    eTOMs:
      - 1.4.1-Service_Strategy_Management-v24.5
      - 1.4.1.8-Service_Test_Strategy-v24.5
    owners:
      - url: Redacted
        name: Redacted
        email: Redacted
    status: specified
    version: 1.0.0
    description: >-
      Service Test Management is responsible for managing the service test
      specification and executing tests based on this specification to ensure
      the service operates correctly.


      Service Test Specification involves capturing potential tests for each
      Service Specification that can be initiated either automatically or
      manually by the service user. These tests are derived from those available
      at the service specification or resource specification level.


      The scope of the component includes the end-to-end execution and reporting
      of tests, tailored to the specific context and actor involved.
