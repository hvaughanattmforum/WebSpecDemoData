  componentMetadata:
    id: TMFC023
    name: PartyInteractionManagement
    version: 1.1.2
    description: Party Interaction deals with the initial greeting and welcoming of a new contact. 
      This will typically be the first component in a customer experience journey, 
      shared by unassisted (self-service, retail kiosk) or assisted (call center, retail store) channels. 
      It will identify known Parties or new Parties and react appropriately to propose available actions. 
      It records all the interactions for the Parties from all channels.
