  name: components.oda.tmforum.org
spec:
  coreFunction:
    dependentAPIs:
    - id: TMF688
      required: false
      resources:
      - hub:
        - GET
        - POST
        - GET /id
        - DELETE /id
      version: 4
      apiSDO: tmForum
    exposedAPIs:
    - id: TMF688
      required: true
      resources:
      - topic:
        - GET
        - POST
        - GET /id
        - PATCH /id
        - DELETE /id
      - topic/id/event:
        - POST
      - topic/id/queryStore:
        - GET
      - topic/id/hub:
        - GET
        - POST
        - GET /id
        - PATCH /id
        - DELETE /id
      - topic/id/importJob:
        - GET
        - POST
        - GET /id
        - PATCH /id
        - DELETE /id
      - topic/id/exportJob:
        - GET
        - POST
        - GET /id
        - PATCH /id
        - DELETE /id
      version: 4
      apiSDO: tmForum
    publishedEvents:
    - call-back: /{{.Release.Name}}-{{.Values.component.type}}/tmf-api/EventManagement/call-back
      implementation: /{{.Release.Name}}-EventManagement
      name: EventManagement
      port: 80
      resources:
      - topicCreateEvent
      - TopicAttributeValueChangeEvent
      - TopicStateChangeEvent
      - TopicDeleteEvent
      - HubCreateEvent
      - HubAttributeValueChangeEvent
      - HubStateChangeEvent
      - HubDeleteEvent
      specification: https://github.com/tmforum-apis/TMF688-EventManagement/blob/master/TMF688-EventManagement-v4.0.0.swagger.json
      apiType: openapi
    subscribedEvents: []
  componentMetadata:
    id: TMFC019
    name: EventManagement
    version: 1.1.1
    description: The Event Management component is a messaging management component, responsible for processing events as they happen from components. 
      Processing of a record of activities includes modeling event messages, syntax validation and formatting of event messages and sending/receiving 
      messages between components (consumer/producer). The Event Management component supports different patterns of usage, including 
      event notification (subscription), event-sourcing (representational state changes) and event-carried state transfer 
      (including data needed to perform further processing). The Event Management component includes functionality providing a centralized 
      CQRS query store for all components that implement event-sourcing with event carrier state transfer.
    publicationDate: 2023-08-18 00:00:00
    status: specified
    functionalBlock: DecouplingAndIntegration
    owners:
