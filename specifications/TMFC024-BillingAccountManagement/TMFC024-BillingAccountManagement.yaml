    description: The billing account management component aims to provide all the needed functionalities to create, configure and modify billing accounts. BAM component has the goal to support and handle the following capabilities/ functionalities. Set-up/ creation of Billing account. Associate payment plan(s), Associate payment method(s) - optional, Account taxes/ fees exception management, Define account associations, Provide account balance details, Set-up Billing contacts, Set-up Billing preferences (e.g., bill cycle frequency, invoice media type, invoice template option, etc.)
