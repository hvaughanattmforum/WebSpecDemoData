name: Component Release

on: 
  workflow_dispatch:
    inputs:
      ref_name:
        description: 'Branch name'
        required: true
        default: 'v1beta2'

  push:
    branches:
      - v1beta*

jobs:
  trigger_target:
    runs-on: ubuntu-latest
    steps:
      - name: Release
        env: 
          BRANCH_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.DEVOPS_TOKEN }}
        run: |
          echo $BRANCH_NAME
          curl -X POST \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/tmforum-rand/TMForum-ODA-CI/actions/workflows/72084960/dispatches \
          -d "{\"ref\":\"main\", \"inputs\": {\"ref_name\":\"$BRANCH_NAME\"}}"
