name: Trigger Tests
run-name: Component validation checks ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      ref_name:
        description: 'Branch name to validate (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

  push:
    branches:
      - 'main'
      - 'v1beta*'
      - 'v1.*'

  pull_request:
    branches:
      - 'main'
      - 'v1beta*'
      - 'v1.*'

permissions:
  contents: read


jobs:
  component-validation-checks:
    runs-on: ubuntu-latest
    steps:
      # When run manually, checkout the user-provided ref_name
      - name: Checkout (manual ref)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref_name }}

      # For push/PR, checkout the commit/merge ref
      - name: Checkout (event ref)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip3 install -r ci/requirements.txt

      - name: Validate component schema
        run: python3 ci/validateComponents.py
