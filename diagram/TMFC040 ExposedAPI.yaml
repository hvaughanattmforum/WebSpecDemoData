@startyaml
exposedAPIs:
    - id: TMF635
      name: Usage ManagementAPI
      required: true
      resources:
      - usage:
        - GET
        - GET/id
        - POST

    - id: TMF677
      name: Usage Consumption Management API
      required: true
      resources:
      - queryUsageConsumption:
        - GET
        - GET/id
        - POST

    - id: TMF701
      name: Process Flow Management API
      required: false
      resources:
      - processFlow:
        - GET
        - GET /id
        - POST
        - DELETE /id
      - taskFlow:
        - GET
        - GET /id
        - PATCH /id

@endyaml