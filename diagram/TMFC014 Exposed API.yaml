@startyaml
exposedAPIs:
    - id: TMF673
      name: Geographic Address Management API
      required: true
      resources:
      - geographicAddressValidation:
        - GET
        - GET /id
        - POST
        - PATCH
      - geographicAddress:
        - GET
        - GET /id
      - geographicSubAddress:
        - GET
        - GET /id
      version: 4
    - id: TMF674
      name: Geographic Site Management API
      required: true
      resources:
      - geographicSite:
        - GET
        - GET /id
        - POST
        - PATCH
        - DELETE
      version: 4
    - id: TMF675
      name: Geographic Location Management API
      required: true
      resources:
      - geographicLocation:
        - GET
        - GET /id
        - POST
        - PATCH
        - DELETE
      version: 4
    - id: TMF701
      name: Process Flow Management API
      required: false
      resources:
      - processFlow:
        - POST
        - GET
        - GET /id
        - DELETE
      - taskFlow:
        - PATCH
        - GET
        - GET /id
      version: 4
    
@endyaml